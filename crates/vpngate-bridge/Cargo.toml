[package]
name = "vpngate-bridge"
description = "FFI bridge crate (flutter_rust_bridge) connecting vpngate-core to Flutter on Android and iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib -> Android (.so) / Windows (.dll) / Linux (.so) / macOS (.dylib)
# staticlib -> iOS (.a / .xcframework) for NEPacketTunnelProvider & Flutter app
# rlib -> Rust integration tests
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vpngate-core = { path = "../vpngate-core" }

[lints]
workspace = true
