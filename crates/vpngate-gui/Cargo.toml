[workspace]
resolver = "2"
members = ["."]

[package]
name = "vpngate-gui"
version = "0.5.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/warmaster726/vpngate-connect"
authors = ["warmaster726 <warmaster726@users.noreply.github.com>"]
description = "Native eframe/egui desktop GUI for VPN Gate Connect"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
tokio = { version = "1.54", features = ["net", "rt", "time"] }
vpngate-core = { path = "../vpngate-core" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
panic = "abort"
