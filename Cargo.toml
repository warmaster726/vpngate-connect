[workspace]
resolver = "2"
members = [
    "crates/vpngate-core",
    "crates/vpngate-cli",
    "crates/vpngate-launcher",
]
exclude = ["web"]

[workspace.package]
# Cargo crate SemVer (letter revisions like 0.3.4a live in assets/desktop-version.txt
# and vpngate_core::PRODUCT_VERSION — Cargo itself cannot encode 0.3.4a).
# Patch may exceed 9 (0.3.10, 0.3.15, …).
version = "0.3.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/warmaster726/vpngate-connect"
homepage = "https://github.com/warmaster726/vpngate-connect"
authors = ["warmaster726 <warmaster726@users.noreply.github.com>"]
keywords = ["vpn", "vpngate", "l2tp", "ipsec", "openvpn"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
csv = "1.3"
des = "0.8"
hmac = "0.12"
libc = "0.2"
md-5 = "0.10"
num-bigint = "0.4"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "fs", "process", "signal", "macros"] }

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = "warn"

# Optimized for small, fast static desktop binaries
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
