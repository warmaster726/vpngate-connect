[workspace]

[package]
name = "vpngate-connect-worker"
version = "0.2.15"
edition = "2021"
license = "MIT"
publish = false
description = "Isolated Cloudflare Worker for the VPN Gate Connect profile console"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
tokio = { version = "1", default-features = false, features = ["io-util"] }
wasm-bindgen = "0.2"
worker = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
