plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def resolveSdkRoot = {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir == null || sdkDir.trim().isEmpty()) {
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            def props = new Properties()
            localPropsFile.withInputStream { props.load(it) }
            sdkDir = props.getProperty("sdk.dir")
        }
    }
    return sdkDir
}

def resolvedNdkVersion = {
    def sdkDir = resolveSdkRoot()
    if (sdkDir != null) {
        def ndkRoot = new File(sdkDir, "ndk")
        if (ndkRoot.isDirectory()) {
            def versions = ndkRoot.listFiles()
                ?.findAll { it.isDirectory() && new File(it, "source.properties").exists() }
                ?.collect { it.name }
                ?.sort()
            if (versions != null && !versions.isEmpty()) {
                return versions.last()
            }
        }
    }
    return flutter.ndkVersion
}()

def resolvedBuildToolsVersion = {
    def sdkDir = resolveSdkRoot()
    if (sdkDir != null) {
        def btRoot = new File(sdkDir, "build-tools")
        if (btRoot.isDirectory()) {
            def versions = btRoot.listFiles()
                ?.findAll { it.isDirectory() && new File(it, "source.properties").exists() }
                ?.collect { it.name }
                ?.sort()
            if (versions != null && !versions.isEmpty()) {
                return versions.last()
            }
        }
    }
    return "36.0.0"
}()

android {
    namespace = "org.vpngate.connect"
    compileSdk = Math.max(36, flutter.compileSdkVersion as int)
    buildToolsVersion = resolvedBuildToolsVersion
    ndkVersion = resolvedNdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "org.vpngate.connect"
        minSdk = 24
        targetSdk = Math.max(36, flutter.targetSdkVersion as int)
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            def abiEnv = System.getenv("VPNGATE_ANDROID_ABIS")
            if (abiEnv != null && !abiEnv.trim().isEmpty()) {
                abiFilters.addAll(abiEnv.split(",").collect { it.trim() })
            } else {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("VPNGATE_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty()) {
                storeFile = file(ksPath)
                storePassword = System.getenv("VPNGATE_KEYSTORE_PASS")
                keyAlias = System.getenv("VPNGATE_KEY_ALIAS")
                keyPassword = System.getenv("VPNGATE_KEY_PASS")
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    lintOptions {
        disable "InvalidPackage"
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            def ksPath = System.getenv("VPNGATE_KEYSTORE_PATH")
            signingConfig = (ksPath != null && !ksPath.trim().isEmpty()) ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

// Release-free local source hook: compiles crates/vpngate-bridge (--locked) into jniLibs/
tasks.register("cargoBuildRustBridge", Exec) {
    onlyIf { System.getenv("VPNGATE_SKIP_GRADLE_CARGO") != "1" }
    workingDir = file("../..")
    commandLine = ["bash", "./build-android.sh", "--jni-only"]
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("JniLibFolders") }.configureEach {
    dependsOn("cargoBuildRustBridge")
}

flutter {
    source = "../.."
}
