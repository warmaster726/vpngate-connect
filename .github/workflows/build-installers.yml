name: Build portable installer bundles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cpp-installer
    paths:
      - 'installer-cpp/**'
      - 'assets/vpngate-512.png'
      - 'LICENSE'
      - '.github/workflows/build-installers.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 bundle
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6 for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S installer-cpp -B build/windows
          -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build/windows --config Release --parallel

      - name: Run tests
        id: windows-tests
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Expose Windows test diagnostics
        if: failure() && steps.windows-tests.outcome == 'failure'
        shell: pwsh
        run: |
          $lines = & ctest --test-dir build/windows -C Release --output-on-failure --verbose 2>&1
          $testExit = $LASTEXITCODE
          $details = ($lines | ForEach-Object { [string]$_ }) -join "`n"
          $details = $details -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
          if ($details) { Write-Output "::error title=Windows test diagnostics::$details" }
          if ($testExit -eq 0) {
            Write-Output '::warning title=Windows test diagnostics::CTest passed on diagnostic retry; failure may be transient.'
          }
          exit 0

      - name: Deploy Qt runtime and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) { throw 'Qt installer did not set QT_ROOT_DIR.' }
          $sourceExe = Join-Path $PWD 'build/windows/Release/vpngate-installer.exe'
          if (-not (Test-Path -LiteralPath $sourceExe)) { throw "Missing executable: $sourceExe" }

          $stage = Join-Path $env:RUNNER_TEMP 'vpngate-installer-windows-x64'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination $stage
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $stage 'LICENSE')

          $windeployqt = Join-Path $qtRoot 'bin/windeployqt.exe'
          if (-not (Test-Path -LiteralPath $windeployqt)) { throw "Missing windeployqt: $windeployqt" }
          & $windeployqt --release --compiler-runtime --no-translations `
            --dir $stage (Join-Path $stage 'vpngate-installer.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

          @'
          VPN Gate Connect Installer - Windows x64

          Run vpngate-installer.exe --help for CLI usage, or launch it without arguments for the GUI.
          The installer downloads/builds the VPN client when an install workflow is run.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'README.txt') -Encoding utf8

          & (Join-Path $stage 'vpngate-installer.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows installer --help check failed.' }

          $archive = Join-Path $env:RUNNER_TEMP 'vpngate-installer-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          "WINDOWS_BUNDLE=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-installer-windows-x64
          path: ${{ runner.temp }}/vpngate-installer-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux-x64:
    name: Linux x64 bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            qt6-tools-dev curl file patchelf desktop-file-utils

      - name: Configure
        run: >-
          cmake -S installer-cpp -B build/linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build Release
        id: linux-build
        run: cmake --build build/linux --parallel

      - name: Expose Linux compiler diagnostics
        if: failure() && steps.linux-build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          cmake --build build/linux --parallel --verbose > "$RUNNER_TEMP/linux-build-diagnostics.log" 2>&1
          build_exit=$?
          diagnostics=$(tail -n 80 "$RUNNER_TEMP/linux-build-diagnostics.log")
          diagnostics=${diagnostics//%/%25}
          diagnostics=${diagnostics//$'\r'/%0D}
          diagnostics=${diagnostics//$'\n'/%0A}
          if [ -n "$diagnostics" ]; then
            echo "::error title=Linux compiler diagnostics::$diagnostics"
          fi
          if [ "$build_exit" -eq 0 ]; then
            echo '::warning title=Linux compiler diagnostic::Build passed on diagnostic retry; failure may be transient.'
          fi
          exit 0

      - name: Run tests
        run: ctest --test-dir build/linux --output-on-failure

      - name: Deploy Qt runtime and archive AppDir
        shell: bash
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/vpngate-installer-linux-x64.AppDir"
          mkdir -p "$appdir/usr/bin" \
            "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps" \
            "$appdir/usr/share/licenses/vpngate-installer"
          install -m 0755 build/linux/vpngate-installer "$appdir/usr/bin/vpngate-installer"
          install -m 0644 assets/vpngate-512.png \
            "$appdir/usr/share/icons/hicolor/512x512/apps/vpngate-installer.png"
          install -m 0644 LICENSE "$appdir/usr/share/licenses/vpngate-installer/LICENSE"
          cat > "$appdir/usr/share/applications/vpngate-installer.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=VPN Gate Connect Installer
          Exec=vpngate-installer
          Icon=vpngate-installer
          Categories=Network;Utility;
          Terminal=false
          EOF
          cat > "$appdir/README.txt" <<'EOF'
          VPN Gate Connect Installer - Linux x64

          Extract this archive and run ./AppRun --help, or launch ./AppRun without arguments for the GUI.
          The installer downloads/builds the VPN client when an install workflow is run.
          EOF

          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            "$RUNNER_TEMP/linuxdeploy-plugin-qt-x86_64.AppImage"
          mkdir -p "$RUNNER_TEMP/linuxdeploy-tools"
          cp "$RUNNER_TEMP/linuxdeploy-plugin-qt-x86_64.AppImage" \
            "$RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-plugin-qt"
          chmod +x "$RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-plugin-qt"
          export PATH="$RUNNER_TEMP/linuxdeploy-tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          test -n "$QMAKE"

          "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/vpngate-installer" \
            --desktop-file "$appdir/usr/share/applications/vpngate-installer.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/512x512/apps/vpngate-installer.png" \
            --plugin qt

          test -x "$appdir/AppRun"
          "$appdir/AppRun" --help
          archive="$RUNNER_TEMP/vpngate-installer-linux-x64.tar.gz"
          tar -czf "$archive" -C "$appdir" .
          echo "LINUX_BUNDLE=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-installer-linux-x64
          path: ${{ runner.temp }}/vpngate-installer-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
